[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beeper-events-sidecar"
version = "0.1.0"
description = "Isolated, durable OpenAI MCP Events sidecar for a private Beeper Server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lauris Heinsalu" }]
dependencies = [
  "aiohttp>=3.10,<4",
  "standardwebhooks==1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
beeper-events-sidecar = "beeper_events_sidecar.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
