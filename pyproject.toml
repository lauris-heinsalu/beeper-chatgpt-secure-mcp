[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beeper-events-sidecar"
version = "1.0.0"
description = "Durable MCP Events sidecar that adds realtime capture beside an unchanged Beeper MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lauris Heinsalu" }]
keywords = ["beeper", "chatgpt", "mcp", "events", "webhooks"]
dependencies = [
  "aiohttp>=3.11,<4",
  "standardwebhooks==1.1.0",
]

[project.urls]
Repository = "https://github.com/lauris-heinsalu/beeper-chatgpt-secure-mcp"
Issues = "https://github.com/lauris-heinsalu/beeper-chatgpt-secure-mcp/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
beeper-events-sidecar = "beeper_events_sidecar.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
